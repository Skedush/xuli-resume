name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  verify-production:
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for production revision
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 48); do
            deployed_revision=$(curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://resume.zzzxc.com/version.txt?revision=${EXPECTED_REVISION}&attempt=${attempt}" || true)

            if [ "$deployed_revision" = "$EXPECTED_REVISION" ]; then
              echo "Production is running $EXPECTED_REVISION"
              exit 0
            fi

            echo "Waiting for production deployment ($attempt/48)..."
            sleep 5
          done

          echo "Production did not reach $EXPECTED_REVISION within 4 minutes."
          exit 1
