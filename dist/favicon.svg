<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="#0B0F14"/>
  <!-- Abstract document outline -->
  <path d="M25 15 L65 15 L75 25 L75 85 L25 85 Z" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Folded corner -->
  <path d="M65 15 L65 25 L75 25" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linejoin="round"/>
  <!-- Neural network nodes inside document -->
  <circle cx="40" cy="40" r="4" fill="url(#grad)"/>
  <circle cx="55" cy="35" r="3" fill="url(#grad)" opacity="0.7"/>
  <circle cx="60" cy="50" r="4" fill="url(#grad)"/>
  <circle cx="45" cy="55" r="3" fill="url(#grad)" opacity="0.7"/>
  <circle cx="50" cy="70" r="4" fill="url(#grad)"/>
  <!-- Connections -->
  <line x1="40" y1="40" x2="55" y2="35" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="55" y1="35" x2="60" y2="50" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="60" y1="50" x2="50" y2="70" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="40" y1="40" x2="45" y2="55" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="45" y1="55" x2="50" y2="70" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
</svg>